<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit & Recalculate Prediction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Edit Employee & Recalculate Prediction</h3>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <h5 class="text-muted mb-3">Employee Information</h5>
      <div class="row mb-3">
        <div class="col-md-4">
          <label>Employee ID</label>
          <input type="number" name="employee_id" value="{{ record.employee_id }}" class="form-control" required>
        </div>
      </div>

      <hr>

    
      <h5 class="text-muted mb-3">Performance & Work Information</h5>
      <div class="row mb-3">
        <div class="col-md-4">
          <label>Job Satisfaction (1–5)</label>
          <input type="number" step="0.1" min="0" max="5" name="jobsatisfaction"
                 value="{{ record.jobsatisfaction }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Work Life Balance (1–5)</label>
          <input type="number" step="0.1" min="0" max="5" name="worklifebalance"
                 value="{{ record.worklifebalance }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Performance Rating (1–5)</label>
          <input type="number" step="0.1" min="0" max="5" name="performancerating"
                 value="{{ record.performancerating }}" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label>Salary</label>
          <input type="number" step="0.1" name="salary" value="{{ record.salary }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Years at Company</label>
          <input type="number" step="0.1" name="yearsatcompany" value="{{ record.yearsatcompany }}" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label>Overtime</label>
          <select name="overtime" class="form-select">
            <option value="0" {% if record.overtime == 0 %}selected{% endif %}>No</option>
            <option value="1" {% if record.overtime == 1 %}selected{% endif %}>Yes</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label>Overtime Month</label>
          <input type="text" name="overtime_month" value="{{ record.overtime_month }}" class="form-control">
        </div>
        <div class="col-md-4">
          <label>Overtime Count</label>
          <input type="number" name="overtime_count" value="{{ record.overtime_count }}" class="form-control">
        </div>
        <div class="col-md-4">
          <label>High Salary</label>
          <select name="highsalary" class="form-select">
            <option value="0" {% if record.highsalary == 0 %}selected{% endif %}>No</option>
            <option value="1" {% if record.highsalary == 1 %}selected{% endif %}>Yes</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label>Long Tenure</label>
          <select name="longtenure" class="form-select">
            <option value="0" {% if record.longtenure == 0 %}selected{% endif %}>No</option>
            <option value="1" {% if record.longtenure == 1 %}selected{% endif %}>Yes</option>
          </select>
        </div>
      </div>

      <hr>

      
      <div class="text-center">
        <button type="submit" class="btn btn-success">Recalculate Prediction</button>
        <a href="{{ url_for('records') }}" class="btn btn-secondary ms-2">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
